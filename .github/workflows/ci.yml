name: DGX CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kineticheck-dgx-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scientific:
    name: DGX / scientific, package, CLI, GUI
    # Public fork PR code must never execute on the persistent DGX host.
    if: >-
      github.event_name != 'pull_request' ||
      (github.actor == github.repository_owner &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, ARM64, dgx-spark]
    timeout-minutes: 35
    env:
      PIP_NO_CACHE_DIR: "1"
      PYTHONNOUSERSITE: "1"
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          clean: true
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.0.0
        with:
          python-version: "3.12"
      - name: Activate the verified DGX Tk and Xvfb runtime
        shell: bash
        run: |
          set -euo pipefail
          runtime=/opt/catalysttwin-actions/shared-gui-runtime
          test -x "$runtime/usr/bin/Xvfb"
          test -x "$runtime/usr/bin/xvfb-run"
          test -f "$runtime/usr/lib/aarch64-linux-gnu/libtk8.6.so"
          test -d "$runtime/usr/share/tcltk/tk8.6"
          echo "$runtime/usr/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$runtime/usr/lib/aarch64-linux-gnu:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          echo "TK_LIBRARY=$runtime/usr/share/tcltk/tk8.6" >> "$GITHUB_ENV"
      - name: Install project and validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Ruff format
        run: python -m ruff format --check .
      - name: Ruff lint
        run: python -m ruff check .
      - name: Strict typing
        run: python -m mypy
      - name: Unit, regression, integration, GUI, and import-isolation tests
        run: xvfb-run -a python -m pytest
      - name: Scientific and example CLI smoke
        run: |
          kineticheck validate
          kineticheck evaluate examples/operating_point.json --output "$RUNNER_TEMP/kineticheck-point.json"
          kineticheck batch examples/operating_points.csv --output "$RUNNER_TEMP/kineticheck-batch.xlsx"
          kineticheck plot examples/operating_points.csv --criterion C_WP --output "$RUNNER_TEMP/kineticheck-envelope.svg"
      - name: Tk GUI workflow under Xvfb
        run: xvfb-run -a python -m kineticheck.gui --smoke-test
      - name: Build and metadata check
        run: |
          python -m build
          python -m twine check dist/*
      - name: Clean-wheel installation, CLI, GUI, and pip check
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          clean_env="$RUNNER_TEMP/kineticheck-clean-wheel"
          python -m venv "$clean_env"
          "$clean_env/bin/python" -m pip install --no-cache-dir "$wheel"
          "$clean_env/bin/python" -m pip check
          "$clean_env/bin/kineticheck" validate
          xvfb-run -a "$clean_env/bin/python" -m kineticheck.gui --smoke-test
      - name: Dependency audit
        run: python -m pip_audit
