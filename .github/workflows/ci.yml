name: DGX CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kineticheck-dgx-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scientific:
    name: DGX / scientific, package, CLI, GUI
    # Public fork PR code must never execute on the persistent DGX host.
    if: >-
      github.event_name != 'pull_request' ||
      (github.actor == github.repository_owner &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, ARM64, dgx-spark]
    timeout-minutes: 35
    env:
      PIP_NO_CACHE_DIR: "1"
      PYTHONNOUSERSITE: "1"
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          clean: true
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: "3.12"
      - name: Install project and validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Ruff format
        run: python -m ruff format --check .
      - name: Ruff lint
        run: python -m ruff check .
      - name: Strict typing
        run: python -m mypy
      - name: Unit, regression, integration, and import-isolation tests
        run: python -m pytest -m "not gui"
      - name: Scientific and example CLI smoke
        run: |
          kineticheck validate
          kineticheck evaluate examples/operating_point.json --output "$RUNNER_TEMP/kineticheck-point.json"
          kineticheck batch examples/operating_points.csv --output "$RUNNER_TEMP/kineticheck-batch.xlsx"
          kineticheck plot examples/operating_points.csv --criterion C_WP --output "$RUNNER_TEMP/kineticheck-envelope.svg"
      - name: Tk GUI workflow under Xvfb
        run: xvfb-run -a python -m kineticheck.gui --smoke-test
      - name: Build and metadata check
        run: |
          python -m build
          python -m twine check dist/*
      - name: Clean-wheel installation, CLI, GUI, and pip check
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          clean_env="$RUNNER_TEMP/kineticheck-clean-wheel"
          python -m venv "$clean_env"
          "$clean_env/bin/python" -m pip install --no-cache-dir "$wheel"
          "$clean_env/bin/python" -m pip check
          "$clean_env/bin/kineticheck" validate
          xvfb-run -a "$clean_env/bin/python" -m kineticheck.gui --smoke-test
      - name: Dependency audit
        run: python -m pip_audit
