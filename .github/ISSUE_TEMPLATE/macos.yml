name: macOS or GUI issue
description: Report installation, Tk, window lifecycle, export, or backend failure.
title: "[macOS/GUI] "
labels: [macos, gui]
body:
  - type: markdown
    attributes:
      value: "Do not attach confidential data. Include the complete traceback as text."
  - type: input
    id: macos
    attributes:
      label: macOS version and architecture
      placeholder: macOS 15.x, Apple Silicon or Intel
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Python, KinetiCheck, Tk, and matplotlib versions
    validations:
      required: true
  - type: textarea
    id: install
    attributes:
      label: Installation method and exact GUI command
    validations:
      required: true
  - type: textarea
    id: traceback
    attributes:
      label: Complete traceback
      render: shell
    validations:
      required: true
