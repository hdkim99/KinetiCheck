name: Bug report
description: Report a reproducible software defect.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not attach unpublished or confidential research data. Create a minimal synthetic reproducer."
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Commands, minimal inputs, expected result, and actual result.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: KinetiCheck and Python versions
    validations:
      required: true
